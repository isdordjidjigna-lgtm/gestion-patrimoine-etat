version: "3.9"

services:
  gateway:
    image: nginx:alpine
    container_name: patrimoine_gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - patrimoine-service
      - occupation-service
      - reporting-service
    networks:
      - patrimoine_net
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    container_name: patrimoine_auth_service
    volumes:
      - ./services/auth-service:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:NBMlWaqhDI5uhFqRyE2aPlj424rpNfcb9YHZwifjdDo=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - auth-db
    networks:
      - patrimoine_net
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: patrimoine_auth_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - patrimoine_net
    restart: unless-stopped

  patrimoine-service:
    build: ./services/patrimoine-service
    container_name: patrimoine_service
    volumes:
      - ./services/patrimoine-service:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:TnWvG/HEwSXf+QJQqKYcCwKMs5of9AwtG+KpgDcJPqA=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: patrimoine-db
      DB_PORT: 5432
      DB_DATABASE: patrimoine_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - patrimoine-db
    networks:
      - patrimoine_net
    restart: unless-stopped

  patrimoine-db:
    image: postgres:16-alpine
    container_name: patrimoine_patrimoine_db
    environment:
      POSTGRES_DB: patrimoine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - patrimoine_data:/var/lib/postgresql/data
    networks:
      - patrimoine_net
    restart: unless-stopped

  occupation-service:
    build: ./services/occupation-service
    container_name: patrimoine_occupation_service
    volumes:
      - ./services/occupation-service:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:I7VGykuAuPtFLLFE/7TlE36WCE7nDiuRX8k4MWaaNJU=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: occupation-db
      DB_PORT: 5432
      DB_DATABASE: occupation_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - occupation-db
    networks:
      - patrimoine_net
    restart: unless-stopped

  occupation-db:
    image: postgres:16-alpine
    container_name: patrimoine_occupation_db
    environment:
      POSTGRES_DB: occupation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - occupation_data:/var/lib/postgresql/data
    networks:
      - patrimoine_net
    restart: unless-stopped

  reporting-service:
    build: ./services/reporting-service
    container_name: patrimoine_reporting_service
    volumes:
      - ./services/reporting-service:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:vIFxi2HtUqUSZJ6N8X8XdIp8kAKjHf0a2hR7JySR0g0=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: reporting-db
      DB_PORT: 5432
      DB_DATABASE: reporting_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - reporting-db
    networks:
      - patrimoine_net
    restart: unless-stopped

  reporting-db:
    image: postgres:16-alpine
    container_name: patrimoine_reporting_db
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - reporting_data:/var/lib/postgresql/data
    networks:
      - patrimoine_net
    restart: unless-stopped

networks:
  patrimoine_net:
    driver: bridge

volumes:
  auth_data:
  patrimoine_data:
  occupation_data:
  reporting_data: