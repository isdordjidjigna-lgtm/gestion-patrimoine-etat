events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
        }

        location /api/patrimoine/ {
            proxy_pass http://patrimoine-service:8000;
            proxy_set_header Host $host;
        }

        location /api/occupation/ {
            proxy_pass http://occupation-service:8000;
            proxy_set_header Host $host;
        }

        location /api/reporting/ {
            proxy_pass http://reporting-service:8000;
            proxy_set_header Host $host;
        }

        location /health {
            return 200 'Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}