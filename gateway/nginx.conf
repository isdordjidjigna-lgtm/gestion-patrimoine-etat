events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            # Le / à la fin retire le préfixe /api/auth/ 
            # Donc /api/auth/login → /login pour Laravel
            proxy_pass http://auth-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/patrimoine/ {
            proxy_pass http://patrimoine-service:8000/;
            proxy_set_header Host $host;
        }

        location /health {
            return 200 'Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}