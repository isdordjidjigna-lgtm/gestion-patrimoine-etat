events { worker_connections 1024; }

http {
    upstream auth_upstream { server auth-service:8000; }
    upstream patrimoine_upstream { server patrimoine-service:8000; }
    upstream occupation_upstream { server occupation-service:8000; }
    upstream reporting_upstream { server reporting-service:8000; }

    server {
        listen 80;
        server_name _;

        location /api/auth/ { proxy_pass http://auth_upstream; proxy_set_header Host $host; }
        location /api/patrimoine/ { proxy_pass http://patrimoine_upstream; proxy_set_header Host $host; }
        location /api/occupation/ { proxy_pass http://occupation_upstream; proxy_set_header Host $host; }
        location /api/reporting/ { proxy_pass http://reporting_upstream; proxy_set_header Host $host; }

        location /health {
            return 200 'Gateway OK';
            add_header Content-Type text/plain;
        }
    }
}
